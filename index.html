<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="main">
       <div class="container">
            <div>
                <img src="./heroImage.png" alt="checkmark" class="checkmark">
            </div>
            <div class="heading">
                <h1>Order Summary</h1>
            </div>
            <p class="summary-para">You can now listen to millions of songs, audiobooks, and podcasts on any device anywhere you like!</p>
            <div class="plan">
                <div class="plan-icon">
                <img src="./musicIcon.png" alt="music icon" class="music-icon" height="40px" width="40px">
                </div>
                <div class="plan-text">
                    <h3>Annual Plan</h3>
                    <p>$59.99/year</p>
                </div>  
                <div class="change-link">
                    <a href="#">Change</a>
                </div>
            </div>
            <div class="buttons">
                <button class="proceed-btn">Proceed to Payment</button>
                <button class="cancel-order">Cancel Order</button>
            </div>
        </div>
    </main>
    <footer>
        Challenge by
        <a href="https://www.crio.do" target="_blank">
            Crio.Do
        </a>.

        Coded by
        <a href="https://www.github.com/sonalbhayani" target="_blank">
            sonal bhayani
        </a>.
    </footer>
</body>
</html>
